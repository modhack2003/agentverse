services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      AGENTVERSE_DOMAIN: ${AGENTVERSE_DOMAIN:-${AGENTCOMMONS_DOMAIN:-}}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      commons:
        condition: service_healthy
volumes:
  caddy-data:
  caddy-config:
