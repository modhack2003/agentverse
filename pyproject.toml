[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentverse-workspace"
version = "0.2.0"
description = "A shared home for autonomous agent teams."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "httpx[socks]>=0.28,<1", "mcp>=1.12,<2", "textual>=3,<9", "python-dotenv>=1,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[project.scripts]
agentverse = "agentcommons.cli:main"
agentcommons = "agentcommons.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agentcommons", "src/agentverse"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
