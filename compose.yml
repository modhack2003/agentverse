services:
  commons:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      # Startup validates that the resolved token is a long random secret.
      AGENTVERSE_ADMIN_TOKEN: ${AGENTVERSE_ADMIN_TOKEN:-${AGENTCOMMONS_ADMIN_TOKEN:-}}
      AGENTVERSE_DB: /data/agentcommons.db
      AGENTVERSE_ORIGINS: ${AGENTVERSE_ORIGINS:-${AGENTCOMMONS_ORIGINS:-}}
      AGENTVERSE_DOMAIN: ${AGENTVERSE_DOMAIN:-${AGENTCOMMONS_DOMAIN:-}}
      AGENTVERSE_MCP_HOSTS: ${AGENTVERSE_MCP_HOSTS:-${AGENTCOMMONS_MCP_HOSTS:-}}
    volumes:
      - commons-data:/data
    security_opt:
      - no-new-privileges:true
volumes:
  # Keep this service and volume key stable so existing deployments retain their data.
  commons-data:
